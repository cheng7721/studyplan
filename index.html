<div class="mini"><a class="sub" href="#vocab"><b class="serif">今日單字</b><br><small>第 ${vset()} 組・${vw()}/${D.vocab.length}</small></a><a class="sub" href="#wrong"><b class="serif">錯題區</b><br><small>${wc()} 題待複習</small></a><a class="sub" href="#roots"><b class="serif">字根字首</b><br><small>${rc()}/${D.roots.length} 熟記</small></a></div>
<a class="sub" href="#exam" style="margin-bottom:14px"><div class="row" style="margin:0"><span class="serif" style="color:var(--ink);font-size:15px">階段抽考 ・ 第 ${exN()} 次</span><span>${exState()}</span></div><small style="color:var(--sub)">本期 ${exR(exN())}・6 題（單字、字根字首、文法、閱讀）</small></a>
<div class="lab" style="margin:18px 4px 8px">SUBJECTS ・ 科目</div><div class="grid">${D.subs.map(s=>{const p=pct(s.ch.map(c=>({id:c.id}))),e=Math.round(s.ch.filter(c=>c.w<=cw).length/s.ch.length*100);return `<a class="sub" href="#s-${s.id}"><h3>${seal(s.n)}${s.n}</h3><p>${s.d}</p>${wkl(s)}<div class="row" style="margin-top:10px"><span>${s.ch.filter(c=>S.done[c.id]).length}/${s.ch.length} 章・預定 ${e}%</span><span>${p}%</span></div>${bar2(p,e)}</a>`}).join('')}</div>`}
function subj(id){const s=D.subs.find(x=>x.id==id),p=pct(s.ch.map(c=>({id:c.id})));
return `<a class="back" href="#home">← 首頁</a><h1>${seal(s.n)}${s.n}</h1><div class="card"><div class="row"><span>${s.d}</span><span>${p}%</span></div>${bar(p)}</div>${s.id=='en'?'<a class="sub" href="#roots" style="margin-bottom:12px">字根字首單字表 →</a>':''}
<div class="card">${s.ch.map(c=>`<a class="ch" href="#c-${c.id}"><div>${c.t}<br><small>預定第 ${c.w} 週</small></div><span class="tag ${S.done[c.id]?'d':''}">${S.done[c.id]?'已完成':Object.keys(S.draft).some(k=>k.startsWith(c.id+':'))?'暫存中':'未完成'}</span></a>`).join('')}</div>`}
function chap(id){const c=byId[id],sh=S.show&&S.show[id],dr=k=>S.draft[id+':'+k];
return `<a class="back" href="#s-${c.sid}">← ${c.sn}</a><h1>${c.t}</h1><div class="lab">預定第 ${c.w} 週 ・ ${S.done[id]?'已完成':'進行中'}</div>
<div class="card"><div class="lab">重點</div><ul class="p">${c.p.map(x=>`<li>${x}</li>`).join('')}</ul><div class="lab" style="margin-top:12px">需熟記</div>${c.m.map(x=>`<span class="chip">${x}</span>`).join('')}</div>
${c.tips?`<div class="card oat"><div class="lab">熟記技巧</div><ul class="p">${c.tips.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
<div class="card"><div class="lab">自編選擇題 ${c.qs.length} 題（選擇會自動暫存）</div>${c.qs.map((q,k)=>`<div class="q" style="margin-top:14px">${k+1}. ${q[0]}</div>${q[1].map((o,i)=>`<button class="opt ${dr(k)==i?'on':''} ${sh&&dr(k)==i&&i!=q[2]?'wrong':''}" onclick="pick('${id}',${k},${i})">${o}</button>`).join('')}${sh?`<div class="fb">${dr(k)==null?'尚未作答。':dr(k)==q[2]?'答對。':'解析：正確答案是「'+q[1][q[2]]+'」。'+(q[3]||'')}</div>`:''}`).join('')}
<button class="btn g" onclick="chk('${id}')">${sh?'重新作答':'核對答案'}</button></div>
<div class="card"><div class="lab">考古題與時事題</div><p style="margin:0;font-size:13.5px;color:var(--sub)">請把本章考古題、近期時事整理到錯題本，週五刷題時回顧。</p></div>
<button class="btn" onclick="fin('${id}')">${S.done[id]?'取消完成':'標記完成'}</button><a class="btn g" href="#s-${c.sid}">暫存並返回</a>`}
function pick(id,k,i){S.draft[id+':'+k]=i;save();render(1)}
function chk(id){S.show=S.show||{};if(S.show[id]){delete S.show[id];byId[id].qs.forEach((q,k)=>delete S.draft[id+':'+k])}else{S.show[id]=1;byId[id].qs.forEach((q,k)=>{const v=S.draft[id+':'+k];if(v!=null&&v!=q[2])S.wrong[id+':'+k]=1})}save();render(1)}
function fin(id){S.done[id]=!S.done[id];save();render(1)}

const cw=curW();const wc=()=>Object.keys(S.wrong).filter(k=>S.wrong[k]).length;
const bar2=(p,e)=>`<div class="bar"><i style="width:${p}%"></i><span style="left:${e}%"></span></div>`;
function wkl(s){const a=s.ch.filter(c=>c.w==cw),o=s.ch.filter(c=>c.w<cw&&!S.done[c.id]);return (a.length?a.map(c=>`<div class="wl"><span class="tag now">本週</span> ${c.t}${S.done[c.id]?' ✓':''}</div>`).join(''):'<div class="wl"><span class="tag">本週</span> 無新章，複習歷屆</div>')+o.map(c=>`<div class="wl"><span class="tag late">待補</span> ${c.t}</div>`).join('')}
function thisWk(){return all.filter(c=>(c.w==cw)||(c.w<cw&&!S.done[c.id])).map(c=>`<a class="chip" href="#c-${c.id}">${c.sn}｜${c.t}${S.done[c.id]?' ✓':c.w<cw?'（待補）':''}</a>`).join('')||'<span class="chip">本週無新章</span>'}
const inRest=d=>d.getDay()==0||D.rest.some(r=>d>=P(r[0])&&d<=P(r[1]));
const nsets=Math.ceil(D.vocab.length/D.per);
function sidx(){let n=0;const e=T>P(D.exam)?P(D.exam):T;for(let d=new Date(P(D.start));d<=e;d.setDate(d.getDate()+1))if(!inRest(d))n++;return Math.max(1,n)}
const vset=()=>(sidx()-1)%nsets+1;
S.vw=S.vw||{};const vw=()=>D.vocab.filter(v=>S.vw[v[0]]).length;
function vocab(k){k=k||vset();const L=D.vocab.slice((k-1)*D.per,k*D.per),done=L.filter(v=>S.vw[v[0]]).length;
return `<a class="back" href="#home">← 首頁</a><h1>單字・第 ${k} 組</h1><a class="back" href="#roots">字根字首單字表 →</a><div class="card"><div class="row"><span>本組 ${done}/${L.length}　全部 ${vw()}/${D.vocab.length}</span><span>${k==vset()?'今日':''}</span></div>${bar(Math.round(vw()/D.vocab.length*100))}
<div style="margin-top:10px"><a class="btn g" href="#v-${Math.max(1,k-1)}">上一組</a><a class="btn g" href="#v-${Math.min(nsets,k+1)}">下一組</a></div></div>
<div class="card">${L.map(v=>`<div class="ch"><div><b class="serif" style="font-size:17px">${v[0]}</b> <small>${v[1]}</small><br><span class="tr" data-w="${v[0]}" onclick="this.classList.toggle('sh')" style="cursor:pointer;color:var(--navy)">${S.vw[v[0]]?v[2]:'<span style=color:var(--sub)>點一下看中文</span>'}</span><small style="display:none">${v[2]}</small></div><span class="tag">${v[3]}</span><button class="tag ${S.vw[v[0]]?'d':''}" onclick="vm('${v[0].replace(/'/g,"\\'")}')" style="font:inherit;cursor:pointer;background:${S.vw[v[0]]?'':'none'}">${S.vw[v[0]]?'已熟':'熟記'}</button></div>`).join('')}</div>`}
function vm(w){S.vw[w]=S.vw[w]?0:1;save();render(1)}
document.addEventListener('click',e=>{const el=e.target.closest('.tr');if(el&&!S.vw[el.dataset.w]){const w=D.vocab.find(v=>v[0]==el.dataset.w);el.innerHTML=el.innerHTML.includes('點一下')?w[2]:'<span style=color:var(--sub)>點一下看中文</span>'}});
function wrongPg(){const ks=Object.keys(S.wrong).filter(k=>S.wrong[k]&&byId[k.split(':')[0]]);
return `<a class="back" href="#home">← 首頁</a><h1>錯題區</h1><p style="color:var(--sub);font-size:13px">答錯的題目會自動收進來。先自己想一次，再按「看解析」。</p>${ks.length?ks.map(k=>{const [id,n]=k.split(':'),c=byId[id],q=c.qs[+n];return `<div class="card"><div class="lab">${c.sn}｜<a href="#c-${id}" style="color:var(--navy)">${c.t}</a></div><div class="q">${q[0]}</div>${q[1].map(o=>`<div class="opt" style="cursor:default">${o}</div>`).join('')}<button class="btn g" onclick="var n=this.nextElementSibling;n.style.display=n.style.display=='block'?'none':'block'">看解析</button><div class="fb" style="display:none">正確答案：「${q[1][q[2]]}」。${q[3]||''}</div><button class="btn g" onclick="wd('${k}')">已熟悉，移出</button></div>`}).join(''):'<div class="card">目前沒有錯題，繼續保持。</div>'}`}
function wd(k){delete S.wrong[k];save();render(1)}
function rootsPg(h){const t=h=='roots-pre'?'首':h=='roots-suf'?'尾':'根',L=D.roots.filter(r=>r[0]==t),nm={根:'字根',首:'字首',尾:'字尾'};
const tab=(x,n,l)=>`<a class="btn ${t==n?'':'g'}" href="#${x}">${l}</a>`;
return `<a class="back" href="#home">← 首頁</a><h1>字根字首</h1><p style="color:var(--sub);font-size:13px">看到不認識的字，先拆成字首＋字根＋字尾猜意思。</p><div>${tab('roots','根','字根')}${tab('roots-pre','首','字首')}${tab('roots-suf','尾','字尾')}</div><div class="row" style="margin-top:10px"><span>已熟記 ${rc()}/${D.roots.length}</span></div>${bar(Math.round(rc()/D.roots.length*100))}<div style="height:10px"></div>${L.map(r=>`<div class="card"><div class="row"><span class="lab" style="margin:0">${nm[t]}</span><button class="tag ${S.rm[t+r[1]]?'d':''}" onclick="rmk('${t+r[1]}')" style="font:inherit;cursor:pointer;background:${S.rm[t+r[1]]?'':'none'}">${S.rm[t+r[1]]?'已熟記':'熟記'}</button></div><div class="serif" style="font-size:18px">${r[1]} <small style="color:var(--sub);font-size:13px">${r[2]}</small></div><div style="margin-top:6px">${r[3].map(w=>`<span class="chip"><b>${w[0]}</b> ${w[1]}</span>`).join('')}</div></div>`).join('')}`}
function plan(){const n=curW();return `<a class="back" href="#home">← 首頁</a><h1>週計畫</h1><p style="color:var(--sub);font-size:13px">週日固定休息；暫定休假：1/1–1/3、2/5–2/14（春節）、2/27–3/1。</p>${D.weeks.map(w=>`<div class="wk ${w.n==n?'now':''}"><h4>第 ${w.n} 週 ・ ${w.s.slice(5).replace('-','/')}–${w.e.slice(5).replace('-','/')} ・ ${w.ph}</h4>${w.tx.map(t=>`<p>${t}</p>`).join('')}</div>`).join('')}`}

S.rm=S.rm||{};S.ex=S.ex||{};
const EP=6,rc=()=>D.roots.filter(r=>S.rm[r[0]+r[1]]).length,T0={根:'字根',首:'字首',尾:'字尾'};
function rmk(k){S.rm[k]=S.rm[k]?0:1;save();render(1)}
const sidxAt=e=>{let n=0;for(let d=new Date(P(D.start));d<=e;d.setDate(d.getDate()+1))if(!inRest(d))n++;return Math.max(1,n)};
const exN=()=>Math.max(1,Math.min(20,Math.floor(Math.round((T-P(D.start))/864e5)/EP)+1));
const exR=n=>{const a=new Date(P(D.start)),b=new Date(a);a.setDate(a.getDate()+(n-1)*EP);b.setDate(b.getDate()+n*EP-1);const f=d=>(d.getMonth()+1)+'/'+d.getDate();return f(a)+'–'+f(b)};
const exState=()=>{const e=S.ex[exN()];return e&&e.sub?'已完成 '+e.sc+'/6':'尚未作答'};
function genExam(n){let s=n*7919+13;const R=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pk=a=>a[Math.floor(R()*a.length)],sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const end=new Date(P(D.start));end.setDate(end.getDate()+n*EP-1);const si=sidxAt(end),ms=(si-1)%nsets+1,sc=Math.min(nsets,si),lv=Math.min(3,1+Math.floor((n-1)/2));
const mk=(t,q,items,x,e)=>{const o=sh(items.map((it,i)=>({it,i})));return{t,q,o:o.map(z=>z.it),a:o.findIndex(z=>z.i==0),x:x&&o.map(z=>x[z.i]),e}};
const VM=D.vocab.slice((ms-1)*D.per,ms*D.per),VS=D.vocab.slice(0,sc*D.per);
const vq=L=>{const w=pk(L);let ds=sh(D.vocab.filter(x=>x[0]!=w[0]&&x[2]!=w[2]&&x[1]==w[1])).slice(0,3);if(ds.length<3)ds=ds.concat(sh(D.vocab.filter(x=>x[0]!=w[0]&&x[2]!=w[2]&&!ds.includes(x))).slice(0,3-ds.length));const al=[w,...ds];
if(R()<.5)return mk('單字題',`<b>${w[0]}</b> 的中文意思是？`,al.map(x=>x[2]),al.map(x=>`${x[2]}＝${x[0]}（${x[1]}）`),`${w[0]}（${w[1]}）＝${w[2]}`);
return mk('單字題',`「${w[2]}」的英文是？`,al.map(x=>x[0]),al.map(x=>`${x[0]}＝${x[2]}（${x[1]}）`),`${w[2]} 的英文是 ${w[0]}`)};
const rq=()=>{const e=pk(D.roots.slice(0,Math.min(D.roots.length,8*n+4))),ot=sh(D.roots.filter(x=>x!=e&&x[2]!=e[2]));
if(R()<.5){const seen=new Set([e[2]]),ds=[];for(const x of ot){if(!seen.has(x[2])){seen.add(x[2]);ds.push(x);if(ds.length==3)break}}const al=[e,...ds];
return mk('字根字首題',`${T0[e[0]]}「${e[1]}」的意思是？`,al.map(x=>x[2]),al.map(x=>`${x[2]}：${x[1]}（例：${x[3][0][0]} ${x[3][0][1]}）`),`${e[1]} ＝ ${e[2]}，例如 ${e[3].slice(0,2).map(w=>w[0]+' '+w[1]).join('、')}`)}
const w=pk(e[3]),ws=new Set(e[3].map(z=>z[0])),pool=[];ot.forEach(x=>x[3].forEach(z=>{if(!ws.has(z[0])&&!pool.some(p=>p[0][0]==z[0]))pool.push([z,x])}));const al=[[w,e],...sh(pool).slice(0,3)];
return mk('字根字首題',`下列哪個字含有${T0[e[0]]}「${e[1]}」（${e[2]}）？`,al.map(a=>a[0][0]),al.map(a=>`${a[0][0]}（${a[0][1]}）：含 ${a[1][1]}＝${a[1][2]}`),`${w[0]}（${w[1]}）含 ${e[1]}＝${e[2]}`)};
const B=a=>{const p=D.bank[a].filter(x=>x[0]<=lv);if(!p.length)return null;const b=pk(p);return mk(a=='g'?'文法題':'閱讀題',b[1],[b[2],...b[3]],null,b[4])};
const Q=[vq(VM),vq(VS),rq(),B('g'),B('r'),pk([()=>vq(VS),rq])()].map(q=>q||vq(VS));return Q}
function examPg(n){const Q=genExam(n),E=S.ex[n]||(S.ex[n]={a:[]}),done=!!E.sub;
return `<a class="back" href="#home">← 首頁</a><h1>階段抽考 ・ 第 ${n} 次</h1><div class="card"><div class="row"><span>期間 ${exR(n)}・6 題</span><span>${done?'成績 '+E.sc+'/6':'尚未交卷'}</span></div><p style="margin:4px 0 8px;font-size:13px;color:var(--sub)">每 ${EP} 天一次，題型含單字、字根字首、文法、閱讀，範圍會逐次擴大。交卷後每題都會標示正確答案並附解析，答對也要看，避免猜對。</p>${n>1?`<a class="btn g" href="#exam-${n-1}">上一次</a>`:''}${n<exN()?`<a class="btn g" href="#exam-${n+1}">下一次</a>`:''}</div>
${Q.map((q,i)=>{const u=E.a[i];return `<div class="card"><div class="lab">${i+1}. ${q.t}</div><div class="q">${q.q}</div>${q.o.map((o,j)=>`<button class="opt ${!done&&u===j?'on':''} ${done&&j==q.a?'right':''} ${done&&u===j&&j!=q.a?'wrong':''}" ${done?'':`onclick="exa(${n},${i},${j})"`}>${o}${done&&j==q.a?' ✓':''}${done&&u===j&&j!=q.a?' ✗':''}</button>${done&&q.x?`<div class="fb" style="margin:-2px 0 4px 8px;font-size:12.5px">${q.x[j]}</div>`:''}`).join('')}${done?`<div class="fb"><b>${u===q.a?'答對。':u==null?'未作答。':'答錯了。'}</b> 正確答案：${q.o[q.a]}。解析：${q.e}</div>`:''}</div>`}).join('')}
${done?`<button class="btn g" onclick="exr(${n})">重新作答</button>`:`<button class="btn" onclick="exs(${n})">交卷</button>`}`}
function exa(n,i,j){S.ex[n].a[i]=j;save();render(1)}
function exs(n){const Q=genExam(n),E=S.ex[n];E.sub=1;E.sc=Q.filter((q,i)=>E.a[i]===q.a).length;save();render()}
function exr(n){S.ex[n]={a:[]};save();render()}
function render(k){const h=location.hash.slice(1);let v;
if(h.startsWith('s-')&&D.subs.some(s=>'s-'+s.id==h))v=subj(h.slice(2));else if(h.startsWith('c-')&&byId[h.slice(2)])v=chap(h.slice(2));else if(h=='plan')v=plan();else if(h=='vocab')v=vocab();else if(h=='wrong')v=wrongPg();else if(/^roots/.test(h))v=rootsPg(h);else if(/^v-\d+$/.test(h))v=vocab(+h.slice(2));else if(/^exam/.test(h))v=examPg(h=='exam'?exN():(+h.slice(5)||exN()));else v=home();
$('#app').innerHTML=v;if(!k)window.scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script></body></html>
