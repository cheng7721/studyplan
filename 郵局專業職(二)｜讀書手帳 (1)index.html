], "per": 20, "rest": [["2027-01-01", "2027-01-03"], ["2027-02-05", "2027-02-14"], ["2027-02-27", "2027-03-01"]]};
const $=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem('pe1'))||{}}catch(e){S={}}S.done=S.done||{};S.draft=S.draft||{};
const save=()=>{try{localStorage.setItem('pe1',JSON.stringify(S))}catch(e){}};
const P=s=>new Date(s+'T00:00');const T=new Date();T.setHours(0,0,0,0);
const left=Math.max(0,Math.round((P(D.exam)-T)/864e5));
const curW=()=>{const w=D.weeks.find(w=>T>=P(w.s)&&T<=P(w.e));return w?w.n:(T<P(D.start)?1:D.weeks.length)};
const all=D.subs.flatMap(s=>s.ch.map(c=>({...c,sid:s.id,sn:s.n})));
const byId=Object.fromEntries(all.map(c=>[c.id,c]));
const pct=a=>a.length?Math.round(a.filter(c=>S.done[c.id]).length/a.length*100):0;
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const doy=Math.floor((T-new Date(T.getFullYear(),0,0))/864e5);
const seal=n=>`<span class="seal">${n[0]}</span>`;
const cal=`<div class="cal"><b>距離 2027/3/5</b><div class="n">${left}</div><i>天 ・ ${T.getMonth()+1}/${T.getDate()}</i></div>`;
function behind(){const w=curW();return D.subs.map(s=>{const need=s.ch.filter(c=>c.w<=w).length,got=s.ch.filter(c=>c.w<=w&&S.done[c.id]).length;return{n:s.n,gap:need-got}}).filter(x=>x.gap>0)}
function daily(){const c=all[doy%all.length],qt=D.quotes[doy%D.quotes.length],b=behind().sort((x,y)=>y.gap-x.gap)[0];
return `<div class="card oat"><div class="lab">TODAY ・ 今日小語</div><div class="serif" style="font-size:16px">${qt}</div>
${b?`<div class="fb" style="color:var(--ink)">本週進度提醒：「${b.n}」落後 ${b.gap} 章，今天補一章就追上。</div>`:`<div class="fb" style="color:var(--ink)">目前進度都跟上了，保持節奏。</div>`}
<hr style="border:0;border-top:1px dashed var(--line);margin:12px 0"><div class="lab">快問快答 ・ ${c.sn}</div><div class="q">${c.q}</div>
${c.o.map((o,i)=>`<button class="opt" onclick="dq(this,${i},${c.a})">${o}</button>`).join('')}<div class="fb" id="dfb"></div></div>`}
function dq(el,i,a){document.querySelectorAll('#app .card.oat .opt').forEach((b,k)=>{b.disabled=true;if(k==a)b.classList.add('right')});
const ok=i==a;if(!ok)el.classList.add('wrong');$('#dfb').textContent=ok?['答對了，今天的你比昨天多會一題。','漂亮，這題考場上不會再跟你客氣。'][doy%2]:['答錯了，沒關係，錯誤答案也是一種經驗，只是考場不收。','這題現在錯，總比考試時錯好，記起來。'][doy%2]}
function home(){const w=D.weeks.find(x=>x.n==curW()),tot=pct(all);
return `<div class="top"><div><small>POSTAL EXAM NOTE</small><h1>郵局專業職(二)<br>讀書手帳</h1><small>${D.start.replace(/-/g,'/')} – ${D.exam.replace(/-/g,'/')}</small></div>${cal}</div>
${daily()}
<div class="card"><div class="row"><span>整體進度</span><span>${tot}%</span></div>${bar(tot)}</div>
<div class="card"><div class="lab">THIS WEEK ・ 第 ${w.n} 週｜${w.ph}</div><div class="row"><span>${w.s.slice(5).replace('-','/')} – ${w.e.slice(5).replace('-','/')}</span><a href="#plan" style="color:var(--navy)">全部週計畫 →</a></div><ul class="p">${w.tx.map(t=>`<li>${t}</li>`).join('')}</ul></div>
<a class="sub" href="#vocab" style="margin-bottom:14px"><div class="row"><span class="serif" style="color:var(--ink);font-size:16px">今日單字 ・ 第 ${vset()} 組</span><span>${vw()}/${D.vocab.length} 已熟記</span></div>${bar(Math.round(vw()/D.vocab.length*100))}</a>
<div class="lab" style="margin:18px 4px 8px">SUBJECTS ・ 科目</div><div class="grid">${D.subs.map(s=>{const p=pct(s.ch.map(c=>({id:c.id})));return `<a class="sub" href="#s-${s.id}"><h3>${seal(s.n)}${s.n}</h3><p>${s.d}</p><div class="row"><span>${s.ch.filter(c=>S.done[c.id]).length}/${s.ch.length} 章</span><span>${p}%</span></div>${bar(p)}</a>`}).join('')}</div>`}
function subj(id){const s=D.subs.find(x=>x.id==id),p=pct(s.ch.map(c=>({id:c.id})));
return `<a class="back" href="#home">← 首頁</a><h1>${seal(s.n)}${s.n}</h1><div class="card"><div class="row"><span>${s.d}</span><span>${p}%</span></div>${bar(p)}</div>
<div class="card">${s.ch.map(c=>`<a class="ch" href="#c-${c.id}"><div>${c.t}<br><small>預定第 ${c.w} 週</small></div><span class="tag ${S.done[c.id]?'d':''}">${S.done[c.id]?'已完成':S.draft[c.id]!=null?'暫存中':'未完成'}</span></a>`).join('')}</div>`}
function chap(id){const c=byId[id],dr=S.draft[id],sh=S.show&&S.show[id];

<div class="card"><div class="lab">重點</div><ul class="p">${c.p.map(x=>`<li>${x}</li>`).join('')}</ul><div class="lab" style="margin-top:12px">需熟記</div>${c.m.map(x=>`<span class="chip">${x}</span>`).join('')}</div>
<div class="card"><div class="lab">自編選擇題（選擇會自動暫存）</div><div class="q">${c.q}</div>${c.o.map((o,i)=>`<button class="opt ${dr==i?'on':''} ${sh&&i==c.a?'right':''} ${sh&&dr==i&&i!=c.a?'wrong':''}" onclick="pick('${id}',${i})">${o}</button>`).join('')}
<div class="fb">${sh?(dr==c.a?'答對，記住了。':'再看一次要點，下次就會了。'):''}</div><button class="btn g" onclick="chk('${id}')">核對答案</button></div>

<button class="btn" onclick="fin('${id}')">${S.done[id]?'取消完成':'標記完成'}</button><a class="btn g" href="#s-${c.sid}">暫存並返回</a>`}
function pick(id,i){S.draft[id]=i;save();render(1)}
function chk(id){S.show=S.show||{};S.show[id]=1;save();render(1)}
function fin(id){S.done[id]=!S.done[id];save();render(1)}

const inRest=d=>d.getDay()==0||D.rest.some(r=>d>=P(r[0])&&d<=P(r[1]));
const nsets=Math.ceil(D.vocab.length/D.per);
function sidx(){let n=0;const e=T>P(D.exam)?P(D.exam):T;for(let d=new Date(P(D.start));d<=e;d.setDate(d.getDate()+1))if(!inRest(d))n++;return Math.max(1,n)}
const vset=()=>(sidx()-1)%nsets+1;
S.vw=S.vw||{};const vw=()=>D.vocab.filter(v=>S.vw[v[0]]).length;
function vocab(k){k=k||vset();const L=D.vocab.slice((k-1)*D.per,k*D.per),done=L.filter(v=>S.vw[v[0]]).length;

<div style="margin-top:10px"><a class="btn g" href="#v-${Math.max(1,k-1)}">上一組</a><a class="btn g" href="#v-${Math.min(nsets,k+1)}">下一組</a></div></div>
<div class="card">${L.map(v=>`<div class="ch"><div><b class="serif" style="font-size:17px">${v[0]}</b> <small>${v[1]}</small><br><span class="tr" data-w="${v[0]}" onclick="this.classList.toggle('sh')" style="cursor:pointer;color:var(--navy)">${S.vw[v[0]]?v[2]:'<span style=color:var(--sub)>點一下看中文</span>'}</span><small style="display:none">${v[2]}</small></div><span class="tag">${v[3]}</span><button class="tag ${S.vw[v[0]]?'d':''}" onclick="vm('${v[0].replace(/'/g,"\\'")}')" style="font:inherit;cursor:pointer;background:${S.vw[v[0]]?'':'none'}">${S.vw[v[0]]?'已熟':'熟記'}</button></div>`).join('')}</div>`}
function vm(w){S.vw[w]=S.vw[w]?0:1;save();render(1)}
document.addEventListener('click',e=>{const el=e.target.closest('.tr');if(el&&!S.vw[el.dataset.w]){const w=D.vocab.find(v=>v[0]==el.dataset.w);el.innerHTML=el.innerHTML.includes('點一下')?w[2]:'<span style=color:var(--sub)>點一下看中文</span>'}});
function plan(){const n=curW();return `<a class="back" href="#home">← 首頁</a><h1>週計畫</h1><p style="color:var(--sub);font-size:13px">週日固定休息；暫定休假：1/1–1/3、2/5–2/14（春節）、2/27–3/1。</p>${D.weeks.map(w=>`<div class="wk ${w.n==n?'now':''}"><h4>第 ${w.n} 週 ・ ${w.s.slice(5).replace('-','/')}–${w.e.slice(5).replace('-','/')} ・ ${w.ph}</h4>${w.tx.map(t=>`<p>${t}</p>`).join('')}</div>`).join('')}`}
function render(k){const h=location.hash.slice(1);let v;
if(h.startsWith('s-')&&D.subs.some(s=>'s-'+s.id==h))v=subj(h.slice(2));else if(h.startsWith('c-')&&byId[h.slice(2)])v=chap(h.slice(2));else if(h=='plan')v=plan();else if(h=='vocab')v=vocab();else if(/^v-\d+$/.test(h))v=vocab(+h.slice(2));else v=home();
$('#app').innerHTML=v;if(!k)window.scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script></body></html>
